version: '3.8'

services:
  rbac-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamic-rbac-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - rbac-data:/app/data
    restart: unless-stopped

volumes:
  rbac-data:
