# ---------------------------------------------------------------------------------
# SonarQube / SonarCloud Project Configuration
# Dynamic Role-Based Access Control (RBAC) Authorization Engine
# ---------------------------------------------------------------------------------

sonar.projectKey=techpulse-dynamic-rbac-authorization-engine
sonar.projectName=Dynamic RBAC Authorization Engine
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Source encoding and Java version
sonar.sourceEncoding=UTF-8
sonar.java.source=21

# JaCoCo Code Coverage XML report path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions for boilerplate data transfer objects and database entities
sonar.coverage.exclusions=\
  src/main/java/com/techpulse/rbac/dto/**,\
  src/main/java/com/techpulse/rbac/entity/**,\
  src/main/java/com/techpulse/rbac/config/**,\
  src/main/java/com/techpulse/rbac/*Application.java

sonar.cpd.exclusions=\
  src/main/java/com/techpulse/rbac/dto/**,\
  src/main/java/com/techpulse/rbac/entity/**
