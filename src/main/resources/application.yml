server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: dynamic-rbac-authorization-engine

  datasource:
    url: jdbc:h2:file:./data/rbacdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  security:
    cache-enabled: true

logging:
  level:
    root: INFO
    com.techpulse.rbac: INFO
