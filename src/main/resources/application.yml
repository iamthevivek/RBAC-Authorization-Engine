server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: dynamic-rbac-authorization-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rbacdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driverClassName: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  security:
    cache-enabled: true

logging:
  level:
    root: INFO
    com.techpulse.rbac: INFO
